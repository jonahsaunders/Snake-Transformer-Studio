<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Snake Transformer Studio</title><link rel="icon" href="/snake-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/snake.css"></head>
<body data-token="__PLANAR_TOKEN__" data-version="__PLANAR_VERSION__">
 <header class="topbar"><a class="brand" href="#design"><img src="/snake-icon.svg" width="34" height="34" alt=""><span>Snake<span class="brand-light"> Transformer Studio</span><small>MAGNETICS WORKBENCH</small></span></a><div class="top-actions"><span id="connection" class="connection">Local workspace</span><button id="open-project" class="quiet">Open project</button><button id="save-project">Save project</button><button id="export-top" class="primary">Build package</button></div></header>
 <div class="app-shell"><aside class="sidebar"><div class="sidebar-heading"><span class="eyebrow">YOUR DESIGN</span><button id="reset-design" class="quiet small" title="Restore selected starting design">Reset</button></div><label class="sr-only" for="project-name">Project name</label><input id="project-name" class="name-input" maxlength="64" value="Matrix 16"><label class="field-label" for="preset">Starting design</label><select id="preset"></select><div class="ratio-note"><span>1:1 ratio</span><span>4 copper layers</span></div><div id="parameters"></div><div class="sidebar-footer">Based on Planar Studio <span>v0.1.0</span></div></aside>
 <main><div class="workspace-heading"><div><div class="eyebrow">SNAKE-WINDING MATRIX TRANSFORMER</div><h1 id="design-title">Matrix 16</h1></div><div class="heading-actions"><span class="model-badge">Analytical model</span><button id="pin-design" class="quiet">＋ Compare design</button></div></div>
 <nav class="tabs" aria-label="Workspace"><button data-tab="design" class="active">Design</button><button data-tab="simulate">Simulate</button><button data-tab="compare">Compare <span id="compare-count">0</span></button><button data-tab="build">Build & export</button></nav>
 <div id="error-banner" class="error-banner" role="alert" hidden></div><div id="workspace"></div><div class="bottom-bar"><span id="calculation-status" role="status">Preparing design…</span><span>Local computation · no cloud upload</span></div></main></div>
 <div id="toast" role="status" hidden></div><input id="project-file" type="file" accept=".json,.snake" hidden><input id="measurement-file" type="file" accept=".csv" hidden>
 <script type="module" src="/js/snake/app.js"></script>
</body></html>
